server:
  port: 8080

spring:
  application:
    name: kafka-event-poc

  datasource:
    url: jdbc:h2:mem:eventdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: event-poc-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.example.kafkapoc.dto
        spring.json.value.default.type: com.example.kafkapoc.dto.EventMessage
        spring.json.use.type.headers: false

app:
  kafka:
    topics:
      events: events.created
      events-dlt: events.created.DLT
    retry:
      attempts: 3
      interval-ms: 1000
